<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --surface: #111111;
      --surface2: #181818;
      --border: #242424;
      --green: #22c55e;
      --green-dim: #16a34a;
      --white: #ffffff;
      --gray: #6b7280;
      --gray-light: #d1d5db;
      --display: 'Anton', 'Barlow Condensed', sans-serif;
      --cond: 'Barlow Condensed', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--gray-light);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10,10,10,0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo-badge {
      width: 34px; height: 34px;
      background: var(--green);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--cond);
      font-weight: 900;
      font-size: 14px;
      color: var(--black);
    }

    .nav-logo-text {
      font-family: var(--display);
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.3px;
      color: var(--white);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--gray-light);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--white); }

    .btn-nav {
      background: var(--green);
      color: var(--black) !important;
      font-family: var(--cond);
      font-weight: 900;
      font-size: 15px;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      -webkit-font-smoothing: antialiased;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger span {
      width: 24px; height: 2px;
      background: var(--white);
      border-radius: 2px;
    }

    /* HERO */
    .page-hero {
      padding: 120px 2rem 60px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-family: var(--cond);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: 0 0 22px rgba(34,197,94,0.5);
      margin-bottom: 0.85rem;
    }

    .page-title {
      font-family: var(--display);
      font-size: clamp(46px, 6.6vw, 78px);
      font-weight: 400;
      letter-spacing: 0.5px;
      color: var(--white);
      line-height: 1.02;
      text-shadow: 0 6px 26px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.7);
      margin-bottom: 0.75rem;
    }

    .page-sub {
      font-size: 17px;
      color: var(--gray-light);
      line-height: 1.75;
    }

    /* FILTER TABS */
    .filter-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 2.5rem;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: var(--cond);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--gray-light);
      cursor: pointer;
      transition: all 0.2s;
      -webkit-font-smoothing: antialiased;
    }

    .filter-btn:hover { border-color: var(--green); color: var(--green); }
    .filter-btn.active { background: var(--green); color: var(--black); border-color: var(--green); }

    /* MASONRY GRID */
    .gallery-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 80px;
      columns: 4;
      column-gap: 12px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.4s, filter 0.3s;
      filter: brightness(0.9);
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      filter: brightness(1);
    }

    .gallery-item .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-item:hover .overlay { opacity: 1; }

    .overlay-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }

    .lightbox-inner img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: -44px;
      right: 0;
      background: none;
      border: none;
      color: var(--white);
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .lightbox-close:hover { opacity: 1; }

    .lightbox-prev, .lightbox-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--white);
      font-size: 28px;
      width: 48px; height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 1000;
    }

    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }
    .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.2); }

    /* FOOTER */
    footer {
      background: var(--black);
      border-top: 1px solid var(--border);
      padding: 30px 2rem;
      text-align: center;
    }

    .footer-bottom {
      font-size: 13px;
      color: var(--gray);
      font-family: 'DM Sans', sans-serif;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--cond);
      font-weight: 800;
      font-size: 16px;
      color: var(--green);
      text-decoration: none;
      margin-bottom: 1rem;
      letter-spacing: 0.3px;
      -webkit-font-smoothing: antialiased;
    }

    .back-link:hover { opacity: 0.8; }

    @media (max-width: 900px) {
      .gallery-wrap { columns: 3; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .nav-links.open {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 60px; left: 0; right: 0;
        background: var(--black);
        border-bottom: 1px solid var(--border);
        padding: 1.5rem 2rem;
        gap: 1.25rem;
      }
    }

    @media (max-width: 600px) {
      nav { padding: 0 1.25rem; height: 58px; }
      .page-hero { padding-left: 1.25rem; padding-right: 1.25rem; }
      .gallery-wrap { padding-left: 1.25rem; padding-right: 1.25rem; }
      footer { padding-left: 1.25rem; padding-right: 1.25rem; }
      .nav-logo { min-height: 44px; }
      .back-link { min-height: 44px; align-items: center; }
      .filter-btn { min-height: 44px; padding: 10px 18px; }
      a, button { -webkit-tap-highlight-color: rgba(34,197,94,0.18); }

      .gallery-wrap { columns: 2; }
    }
  </style>
</head>

    <div class="overlay"><div class="overlay-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div></div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightboxOutside(event)">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="" />
  </div>
  <button class="lightbox-prev" onclick="shiftLightbox(-1)">&#8592;</button>
  <button class="lightbox-next" onclick="shiftLightbox(1)">&#8594;</button>
</div>

<footer>
  <div style="margin-bottom:12px;">
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
  <div class="footer-bottom">© 2026 Coach Kayvon. All rights reserved.</div>
</footer>

<script>
  function toggleNav() {
    document.getElementById('navLinks').classList.toggle('open');
  }

  // Filter
  function filterGallery(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.gallery-item').forEach(item => {
      if (cat === 'all' || item.dataset.cat === cat) {
        item.style.display = 'block';
      } else {
        item.style.display = 'none';
      }
    });
  }

  // Lightbox
  let currentIndex = 0;
  let visibleItems = [];

  function openLightbox(el) {
    visibleItems = Array.from(document.querySelectorAll('.gallery-item')).filter(i => i.style.display !== 'none');
    currentIndex = visibleItems.indexOf(el);
    const img = el.querySelector('img');
    document.getElementById('lightboxImg').src = img.src;
    document.getElementById('lightboxImg').alt = img.alt;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function closeLightboxOutside(e) {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  }

  function shiftLightbox(dir) {
    currentIndex = (currentIndex + dir + visibleItems.length) % visibleItems.length;
    const img = visibleItems[currentIndex].querySelector('img');
    document.getElementById('lightboxImg').src = img.src;
    document.getElementById('lightboxImg').alt = img.alt;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') shiftLightbox(1);
    if (e.key === 'ArrowLeft') shiftLightbox(-1);
  });

  // Fade in
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.style.opacity = '1';
        e.target.style.transform = 'translateY(0)';
      }
    });
  }, { threshold: 0.05 });

  document.querySelectorAll('.gallery-item').forEach(el => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(16px)';
    el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    observer.observe(el);
  });
</script>
</body>
</html>
