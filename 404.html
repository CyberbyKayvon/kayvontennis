<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Page not found | Coach Kayvon</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--green:#22c55e;--white:#fff;--gray:#6b7280;--gray-light:#d1d5db;
--display:'Anton','Barlow Condensed',sans-serif;
--body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--cond:'Barlow Condensed',sans-serif}
body{background:var(--black);color:#e5e7eb;font-family:var(--body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:'cv02','cv03','cv04','cv11';line-height:1.6;min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
.lbl{font-family:var(--cond);font-size:15px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
color:var(--green);text-shadow:0 0 22px rgba(34,197,94,.5);margin-bottom:1rem}
h1{font-family:var(--display);font-size:clamp(56px,10vw,120px);font-weight:400;letter-spacing:.5px;color:var(--white);
line-height:.98;margin-bottom:1rem;text-shadow:0 6px 26px rgba(0,0,0,.9)}
h1 span{color:var(--green);display:block;text-shadow:0 0 70px rgba(34,197,94,.65)}
p{font-size:18px;color:var(--gray-light);max-width:500px;margin:0 auto 2.2rem;line-height:1.75}
.btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--cond);font-weight:900;font-size:18px;letter-spacing:.5px;padding:13px 28px;border-radius:10px;
text-decoration:none;display:inline-block;transition:.2s}
.btn-p{background:var(--green);color:var(--black)}
.btn-p:hover{background:#4ade80;transform:translateY(-2px)}
.btn-o{border:2px solid rgba(255,255,255,.32);color:var(--white)}
.btn-o:hover{border-color:var(--white);transform:translateY(-2px)}
</style>
</head>
<body>
<div>
  <p class="lbl">Out of bounds</p>
  <h1>404<span>Wide.</span></h1>
  <p>That page does not exist. Could have been an old link, could have been a typo. Either way, the good stuff is back home.</p>
  <div class="btns">
    <a href="/" class="btn btn-p">Back to Home</a>
    <a href="/submit.html" class="btn btn-o">Send Your Video</a>
  </div>
</div>
</body>
</html>
